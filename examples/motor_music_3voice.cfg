# Full Bambu arrangement: each voice has its own Cartesian axis motor.
# Check the one-motor setup before enabling all three motors.
[motor_music]
voice_x: stepper_x
voice_y: stepper_y
voice_z: stepper_z
amplitude_steps: 1
max_frequency: 1000
max_excursion: 0.1
# Stock A1 start/finish peak at about 2359/2490 combined steps per second.
# The 2000-step limit in the initial single-motor profile is too low here.
max_step_rate: 3000
max_duration: 15
position_margin: 1
allow_during_print: False
# Default: <printer config directory>/tunes
# tune_directory: ~/printer_data/config/tunes
