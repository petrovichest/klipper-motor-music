# Minimal first setup: Bambu's Y voice (the lead in its stock jingles)
# is played through the printer's physical X motor. Other voices are silent.
[motor_music]
voice_y: stepper_x
amplitude_steps: 1
max_frequency: 1000
max_excursion: 0.1
max_step_rate: 2000
max_duration: 15
position_margin: 1
allow_during_print: False
# Default: <printer config directory>/tunes
# tune_directory: ~/printer_data/config/tunes

# After validating each motor on hardware, three voices can be mapped:
# voice_x: stepper_x
# voice_y: stepper_y
# voice_z: stepper_z
# These replace the single-voice mapping above. A higher combined step-rate
# limit may be necessary; slow serial transports may not sustain three voices.
